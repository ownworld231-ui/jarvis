name: Build Jarvis APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app
        run: |
          unzip -o Jarvis.zip
          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n" > Jarvis/gradle.properties
          sed -i 's/gemini-2.5-flash/gemini-flash-latest/' Jarvis/app/src/main/java/com/example/jarvis/Brain.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle -p Jarvis assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: Jarvis/app/build/outputs/apk/debug/app-debug.apk
